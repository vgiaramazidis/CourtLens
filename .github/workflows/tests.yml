name: Tests

on:
  push:
    branches: [main, develop, feature/vasilis]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python -m unittest discover -s tests -t . -p 'test_*.py'
      - run: node --test tests/frontend/*.test.cjs
      - name: Check JavaScript syntax
        run: |
          for file in src/frontend/js/*.js; do node --check "$file"; done
