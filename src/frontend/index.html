<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Euroleague 3D Shot Chart</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .controls { margin-bottom: 20px; }
        input, button { padding: 5px; margin-right: 10px; }
        /* Μεγαλώσαμε λίγο το παράθυρο για καλύτερη 3D εμπειρία */
        #courtContainer { width: 600px; height: 500px; border: 1px solid #ccc; }
    </style>
    
    <!-- Εξωτερικές βιβλιοθήκες για τα 3D γραφικά (Three.js & OrbitControls) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <h1>Euroleague 3D Shot Chart</h1>
    
    <div class="controls">
        <label>Παίκτης (Name/ID):</label>
        <input type="text" id="playerSelect" placeholder="π.χ. 012774 or Nunn">
        
        <label>Ασίστ από (Name/ID):</label>
        <input type="text" id="assistSelect" placeholder="π.χ. 001926 or Slouka">
        
        <button id="searchBtn">Αναζήτηση</button>
        <label>Επιλογή Πεντάδας:</label>
        <select id="lineupSelect" style="width: 300px;">
            <option value="">-- Όλες οι Πεντάδες --</option>
            <!-- Θα γεμίσει δυναμικά μέσω JavaScript -->
        </select>
    </div>
    <!-- Άλλαξε το body σου ώστε να τα βάλει δίπλα-δίπλα -->
    <div style="display: flex; gap: 20px; align-items: flex-start;">
        
        <!-- Το Γήπεδο (Το έχεις ήδη) -->
        <div id="courtContainer"></div>

        <!-- ΝΕΟ: Το YouTube Player -->
        <div id="videoContainer" style="box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; background: #000;">
            <div id="player"></div>
        </div>

    </div>
    <div id="lineupInfo" style="margin-top: 15px; padding: 15px; background: #fff; border: 1px solid #ccc; width: 600px; font-family: sans-serif;">
        <h3 style="margin-top:0;">Πεντάδες τη στιγμή του σουτ:</h3>
        <div style="display: flex; justify-content: space-between;">
            <div style="width: 48%;">
                <strong style="color: #2c3e50;">Γηπεδούχος:</strong>
                <div id="homePlayersList" style="margin-top: 5px; display: flex; flex-direction: column; gap: 5px;">-</div>
            </div>
            <div style="width: 48%;">
                <strong style="color: #2c3e50;">Φιλοξενούμενη:</strong>
                <div id="roadPlayersList" style="margin-top: 5px; display: flex; flex-direction: column; gap: 5px;">-</div>
            </div>
        </div>
    </div>
        <!-- Τα νέα φίλτρα (βάλε τα δίπλα/κάτω από τα υπάρχοντα) -->
    <div class="lineup-controls" style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px;">
        <h3>Ανάλυση Πεντάδων</h3>
        <label>Γηπεδούχος:</label>
        <select id="homeLineupSelect" style="margin-right: 15px;"><option value="">-- Επιλογή --</option></select>
        
        <label>Φιλοξενούμενος:</label>
        <select id="roadLineupSelect"><option value="">-- Επιλογή --</option></select>
        
        <!-- Εδώ θα εμφανίζονται τα κουμπάκια των 5 παικτών -->
        <div id="lineupPlayersDiv" style="margin-top: 15px; display: flex; gap: 10px;"></div>
    </div>

    <!-- Το Tooltip (Κρυφό αρχικά) -->
    <div id="shotTooltip" style="position: absolute; display: none; background: rgba(0,0,0,0.85); color: #fff; padding: 10px; border-radius: 6px; pointer-events: none; z-index: 1000; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
    </div>

    <!-- ΝΕΟ: Φόρτωση του YouTube API -->
    <script>
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: 'xRuH1qSD2dE', // Βάλε το ID του αγώνα που κατέβασες!
                playerVars: {
                    'playsinline': 1,
                    'controls': 1,
                    'rel': 0,
                    'origin': window.location.origin
                }
            });
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- Τα δικά μας αρχεία -->
    <script src="js/api.js"></script>
    <script src="js/court.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
